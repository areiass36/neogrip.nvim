name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit-openresty
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile with every lint as an error
        run: javac -encoding UTF-8 -Xlint:all -Werror -d build/classes java/neogrip/*.java

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache driver jars
        uses: actions/cache@v4
        with:
          path: |
            .testdata/nvim/neogrip/jdbc
            .testdata/nvim-data/neogrip/jdbc
          key: jdbc-${{ hashFiles('lua/neogrip/bootstrap/jdbc.lua') }}
      - name: Run unit and live suites
        # The JDK comes from setup-java so CI never downloads 190 MB; live
        # suites that need a database server skip on runners without one, and
        # the DuckDB-backed ones run everywhere - real sidecar coverage on all
        # three platforms, including the Windows EOF-termination path.
        env:
          NEOGRIP_TEST_JDK: ${{ env.JAVA_HOME }}
          XDG_DATA_HOME: ${{ github.workspace }}/.testdata
        run: nvim --headless -u tests/minimal.lua -l tests/run.lua

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start database servers
        run: tests/containers.sh up
      - name: Run the full suite against real servers
        env:
          NEOGRIP_TEST_JDK: ${{ env.JAVA_HOME }}
          XDG_DATA_HOME: ${{ github.workspace }}/.testdata
          NVIM_DB_TEST_PW: "p@ss:w/rd#1"
          NVIM_DB_TEST_MSSQL_PW: "Str0ng:P/ss#1"
        run: |
          nvim --headless -u tests/minimal.lua -l tests/run.lua | tee live.log
          # Skips must not silently become total: this job exists to reach
          # real servers, so proof of reaching PostgreSQL is asserted.
          grep -q "server: PostgreSQL" live.log
