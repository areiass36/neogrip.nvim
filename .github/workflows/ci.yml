name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit-openresty
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile with every lint as an error
        run: javac -encoding UTF-8 -Xlint:all -Werror -d build/classes java/neogrip/*.java

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run unit and live suites
        # The JDK comes from setup-java so CI never downloads 190 MB; live
        # suites that need a database server skip on runners without one.
        env:
          NEOGRIP_TEST_JDK: ${{ env.JAVA_HOME }}
        run: nvim --headless -u tests/minimal.lua -l tests/run.lua
